:root[data-theme="dark"]{--bg:#0f1527;--card:#18203a;--ink:#eef0f7;--mut:#a3adc8;--acc:#e3b04b;--acc2:#e3b04b;--line:#2b3556;--ok:#6fcf97;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Poppins,Nunito,system-ui,sans-serif;font-weight:700;margin:0}
h1{font-size:1.7rem;letter-spacing:-.01em}
.sub{color:var(--mut);margin:2px 0 16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:.88rem;margin:6px 0 16px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.nav .t{flex:1;text-align:center;font-family:Poppins,Nunito,system-ui,sans-serif;font-size:1.05rem}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;text-decoration:none;display:inline-block}
button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.card svg{display:block;width:100%;height:auto}
.cap{padding:8px 18px;color:var(--mut);font-size:.88rem;font-style:italic;border-bottom:1px solid var(--line)}
.body{padding:18px}
.era{color:var(--acc);font-weight:600;font-size:.95rem}
h2{font-size:1.5rem;margin:2px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips a,.chips button{border-color:var(--acc2);font-weight:600}#rdr{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#rdr[hidden]{display:none}.rh,.rf{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}.rf{border-bottom:0;border-top:1px solid var(--line);justify-content:space-between}.rt{flex:1;text-align:center;font-family:Georgia,serif;line-height:1.3}.rb{flex:1;overflow-y:auto;padding:20px 18px 40px;max-width:680px;width:100%;margin:0 auto;font-family:Georgia,'Times New Roman',serif;line-height:1.9}.rb p{margin:0 0 .7em}.rb sup{color:var(--acc);font:600 .7em system-ui,sans-serif;margin-right:.35em}.rb .nt{font:.9rem/1.5 system-ui,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}.rm{font:.85rem system-ui,sans-serif;color:var(--mut);text-align:center;padding:6px;border-bottom:1px solid var(--line)}.rm button{padding:4px 10px;font-size:.85rem}.ph{opacity:.5}
.min{color:var(--mut);font-size:.9rem}
blockquote{margin:16px 0;padding:4px 0 4px 14px;border-left:3px solid var(--acc);font-family:inherit;font-weight:600;font-size:1.1rem}
blockquote small{display:block;color:var(--mut);font-family:system-ui,sans-serif;font-size:.85rem}
h3{font-size:1rem;margin:18px 0 4px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.done{width:100%;margin-top:14px;background:var(--acc2);color:var(--bg);border-color:var(--acc2);font-weight:600;padding:12px}
.done.on{background:var(--ok);border-color:var(--ok);color:#fff}
details{margin-top:18px}
summary{cursor:pointer;color:var(--mut)}
.list{max-height:320px;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card)}
.list button.cur{background:var(--bg);font-weight:600}
label{display:block;margin-top:10px;color:var(--mut);font-size:.9rem}
input[type=date]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
</style>
</head>

</details>

function idb(fn){return new Promise((ok,no)=>{const r=indexedDB.open('devo-bib',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=no;r.onsuccess=()=>{const t=r.result.transaction('k','readwrite'),q=fn(t.objectStore('k'));t.oncomplete=()=>ok(q.result);t.onerror=no}})}
const chap=(n,c)=>{const i=NC.indexOf(norm(n));return BIB&&BIB[i]&&BIB[i][c-1]||null};
function showCh(){const x=seq[ri],v=chap(x.n,x.c);let h='';$('rtt').innerHTML='<b>'+x.n+' '+x.c+'</b><br><small style="color:var(--mut)">'+(BIB?BN:'Modo de exemplo')+'</small>';if(v)h=v.map((t,i)=>'<p><sup>'+(i+1)+'</sup>'+esc(t)+'</p>').join('');else{h='<div class="nt">'+(BIB?'Este capítulo não está no arquivo carregado.':'Nenhuma Bíblia carregada. O texto abaixo é só um modelo de como a leitura aparece. Carregue um arquivo JSON de Bíblia para ler aqui dentro.')+'</div>';for(let i=1;i<=6;i++)h+='<p class="ph"><sup>'+i+'</sup>Texto de exemplo do versículo '+i+'. O texto real aparece aqui quando a Bíblia é carregada.</p>'}$('rbd').innerHTML=h;$('rbd').style.fontSize=fs+'rem';$('rbd').scrollTop=0;$('rpos').textContent=(ri+1)+' de '+seq.length;$('rp').disabled=ri==0;$('rn').textContent=ri==seq.length-1?'Concluir ✓':'Próximo ›'}
function openR(day,s){seq=[];const p0=[];D[day-1].g.forEach(g=>{p0.push(seq.length);for(let c=g.a;c<=g.z;c++)seq.push({n:g.n,c})});ri=p0[s]||0;rday=day;$('rdr').hidden=false;document.body.style.overflow='hidden';showCh();$('rc').focus()}
function closeR(){$('rdr').hidden=true;document.body.style.overflow=''}
$('rc').onclick=closeR;$('rp').onclick=()=>{ri--;showCh()};
$('rn').onclick=()=>{if(ri>=seq.length-1){st.done[rday]=1;save();closeR();render()}else{ri++;showCh()}};
$('fm').onclick=()=>{fs=Math.max(.9,fs-.1);$('rbd').style.fontSize=fs+'rem'};$('fp').onclick=()=>{fs=Math.min(1.9,fs+.1);$('rbd').style.fontSize=fs+'rem'};
addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('rdr').hidden)closeR()});
$('lb').onclick=$('lb2').onclick=()=>$('bf').click();
$('bf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=parseBible(JSON.parse((await f.text()).replace(/^\uFEFF/,'')));if(!p)throw 0;BIB=p;BN=f.name.replace(/\.json$/i,'');idb(s=>s.put({b:BIB,n:BN},'bib')).catch(()=>{});msg('Bíblia carregada: '+BN);if(!$('rdr').hidden)showCh()}catch(x){msg('Não consegui ler este arquivo. Use um JSON com os 66 livros, capítulos e versículos.')}e.target.value=''};
idb(s=>s.get('bib')).then(x=>{if(x&&x.b){BIB=x.b;BN=x.n;msg('Bíblia carregada: '+BN);if(!$('rdr').hidden)showCh()}}).catch(()=>{});
$('start').value=st.start;
$('start').onchange=e=>{if(e.target.value){st.start=e.target.value;save();cur=todayN();render()}};
render();
</script>
</body>
